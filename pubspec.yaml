name: omms_customer
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # heroicons 
  heroicons: ^0.11.0
  # flutter_riverpod
  flutter_riverpod: ^2.4.10
  # navigation
  go_router: ^16.2.2
  # spash screen animated
  animated_splash_screen: ^1.3.0
  # font google
  google_fonts: ^6.3.2
  # pin input
  pinput: ^5.0.2
  # responsive screen
  flutter_screenutil: ^5.9.3
  # image svg
  flutter_svg: ^2.2.1
  # shared preferences
  shared_preferences: ^2.5.3
  # value equality
  equatable: ^2.0.7
  # environment variables
  flutter_dotenv: ^6.0.0
  # JWT decoder
  jwt_decoder: ^2.0.1
  # dio for http requests
  dio: ^5.9.0
  # retrofit for api client
  retrofit: ^4.9.0
  logger: ^2.6.0 
  json_annotation: ^4.9.0
  # easy localization
  easy_localization: ^3.0.8
  # shimmer
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  # retrofit for api client
  retrofit_generator: ^10.0.1
  build_runner: ^2.6.0
  json_serializable: ^6.10.0

flutter:
  uses-material-design: true


  assets:
    - .env
    - assets/icons/navigation/

    - assets/images/user/

    - assets/lang/